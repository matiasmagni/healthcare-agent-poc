[project]
name = "healthcare-agent"
version = "1.0.0"
description = "Production-grade AI Agent with Tool-Calling for PostgreSQL Healthcare Records"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Matías J. Magni", email = "matias.magni@gmail.com" },
]
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "openai>=1.40.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "SQLAlchemy>=2.0.32",
    "psycopg2-binary>=2.9.9",
    "psycopg[binary]>=3.1.0",
    "typing-extensions>=4.12.0",
]

[project.scripts]
healthcare-agent = "healthcare_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["healthcare_agent"]

[tool.uv]
dev-dependencies = []
